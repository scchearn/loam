# Loam MQTT broker — Mosquitto configuration (T2).
#
# ${VARS} are resolved from params.env at install time (envsubst or sed).
# Split TLS trust model: server cert = certbot/Let's Encrypt; client verification = org CA.
#
# Constraint trace:
#   allow_anonymous false        -> spec: no anonymous listener, ever
#   require_certificate true     -> spec: mTLS is sole auth
#   use_identity_as_username true-> spec: cert CN is the authenticated principal (authorizes data.from.principal_id)
#   persistence true             -> spec: retained state survives restart
#   *_maximum / message_size     -> spec: bounded quotas (calibration knobs)

per_listener_settings true

# ---- The ONLY listener: MQTTS. No plaintext, no anonymous. -------------------
listener ${LISTENER_PORT}
allow_anonymous false

# ---- TLS: server cert from certbot (public/LE), client verification from org CA ----
certfile ${CERTBOT_LIVE_DIR}/fullchain.pem
keyfile  ${CERTBOT_LIVE_DIR}/privkey.pem
# cafile is the ORG CA used to verify CLIENT certs (NOT the server cert's chain):
cafile   ${PKI_DIR}/ca.crt
# crlfile makes client revocation effective (regenerated by pki/revoke-client.sh):
crlfile  ${PKI_DIR}/crl.pem
tls_version tlsv1.2
require_certificate true
use_identity_as_username true

# ---- ACL ---------------------------------------------------------------------
acl_file ${MOSQ_ETC}/acl

# ---- Persistence (retained state survives restart) ---------------------------
persistence true
persistence_location ${MOSQ_PERSIST}/
autosave_interval 60

# ---- Bounded quotas / expiry (calibration knobs) -----------------------------
max_queued_messages 1000
max_inflight_messages 20
message_size_limit 262144
max_keepalive 120

# ---- Logging (no payloads) ---------------------------------------------------
log_dest syslog
log_type warning
log_type notice
connection_messages true
