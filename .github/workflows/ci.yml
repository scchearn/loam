# Repository gates: contract tests, curation, version agreement on changes, and
# a daily strict check that the package-baked RUNTIME_VERSION still resolves. Rust workspace
# checks live in cli.yml, which is path-filtered to the runtime lane.
name: ci

on:
  push:
    branches: [main, federation]
  pull_request:
  schedule:
    # Daily, so a release that never finished publishing is reported even when
    # nobody pushes.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: bash bin/check-curation.sh
      - run: bash bin/setup-contract-test
      # The enrollment signer's availability contract (#93): it must keep
      # serving while a client stalls mid-handshake. python3 + openssl only.
      - run: python3 deploy/mqtt-broker/enroll/test_signer.py
      - run: skills/loam-work/loam-setting-goals/scripts/goal-contract-test

  node-contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version
      - run: npm ci
      - run: npm test

  release-resolution:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version agreement is now `loam check versions`, so the gate needs the
      # native runtime built before it can run.
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: cargo +1.94.1 build --release --locked
      # Pull requests and pushes assert version agreement. A runtime bump cannot
      # resolve until its post-merge tag publishes the manifest; the release
      # workflow verifies that public resolution immediately after publication.
      - name: Version agreement
        if: github.event_name != 'schedule'
        run: bin/check-release-resolution.sh --versions-only
      # The daily check catches a release that was removed or never completed.
      - name: Strict manifest resolution
        if: github.event_name == 'schedule'
        run: bin/check-release-resolution.sh
