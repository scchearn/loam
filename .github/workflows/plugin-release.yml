name: Plugin Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # GitHub release for the plugin tag
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="${GITHUB_REF_NAME#v}"
          test "$version" = "$expected"

      # Tests run under the runner's default npm (what they are written against).
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

      # OIDC trusted publishing needs npm >= 11.5.1; upgrade only for publish so
      # the test steps above keep the npm they expect.
      - run: npm install -g npm@latest

      # npm does not auto-route prerelease versions away from `latest`; without
      # an explicit --tag a -next version would silently move production. One
      # hardcoded channel: `next` when the version carries a prerelease
      # component, `latest` otherwise.
      - name: Publish package
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"

      # The plugin is the product users install, so its tag owns the
      # repository's "Latest" release; runtime releases are published with
      # --latest=false and never claim it.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel=(--latest)
          [[ "$version" == *-* ]] && channel=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Loam $version" \
            --generate-notes \
            "${channel[@]}"
