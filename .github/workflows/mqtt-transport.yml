name: mqtt-transport

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - cli/**
      - .github/workflows/mqtt-transport.yml
  push:
    branches: [federation]
    paths:
      - Cargo.toml
      - Cargo.lock
      - cli/**
      - .github/workflows/mqtt-transport.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-broker:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Mosquitto and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y mosquitto openssl
      - name: Install Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Run the isolated MQTT 5 broker contract
        env:
          LOAM_MQTT_TEST: "1"
        run: cargo +1.94.1 test --locked --test mqtt_transport -- --ignored --test-threads=1 broker_contract
      - name: Run the connector enrollment round trip and its No Local control
        env:
          LOAM_MQTT_TEST: "1"
        run: cargo +1.94.1 test --locked --test mqtt_connector -- --ignored --test-threads=1
      # The two-instance federation proof points the resolver at per-test
      # fixtures through process-global env vars, so it must run single-threaded
      # like every sibling tier or concurrent tests clobber each other's roster.
      - name: Run the two-instance federation operational proof against a real broker
        env:
          LOAM_MQTT_TEST: "1"
        run: cargo +1.94.1 test --locked --test mqtt_operational -- --ignored --test-threads=1
      # This lane has a real broker but no installed harness, so it
      # runs the real-broker half of the e2e suite and never claims harness
      # compatibility: `bin/real-harness-suite.sh` stays local and opt-in behind
      # LOAM_REAL_HARNESS=1, and ci.yml keeps its fakes-only tier untouched.
      - name: Run the harness e2e suite against a real broker
        env:
          LOAM_MQTT_TEST: "1"
        run: cargo +1.94.1 test --locked --test mqtt_harness -- --ignored --test-threads=1
